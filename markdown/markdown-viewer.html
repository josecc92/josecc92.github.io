<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都更專案文件閱讀器</title>
    
    <!-- 引入 marked.js 來解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 GitHub 風格的 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    
    <style>
        /* 全局設定 */
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif; background-color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* ================= 左側側邊欄 ================= */
        .sidebar {
            width: 280px;
            background-color: #f8f9fa;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        /* 側邊欄標題 */
        .sidebar-header {
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        .sidebar-header h2 { margin: 0; font-size: 20px; }
        .sidebar-header a { color: #bdc3c7; text-decoration: none; font-size: 14px; display: block; margin-top: 5px; }
        .sidebar-header a:hover { color: white; }

        /* 側邊欄清單區塊 */
        .sidebar-nav {
            flex-grow: 1;
            overflow-y: auto; /* 內容過多時可捲動 */
            padding: 15px 10px;
        }
        
        /* 側邊欄連結樣式 */
        .sidebar-nav a {
            display: block;
            padding: 12px 15px;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: background 0.2s;
            font-size: 15px;
        }
        .sidebar-nav a:hover { background-color: #e9ecef; }
        
        /* 當前正在閱讀的文章 (自動套用此樣式) */
        .sidebar-nav a.active {
            background-color: #e3f2fd;
            color: #1976d2;
            font-weight: bold;
            border-left: 4px solid #1976d2;
        }

        .sidebar-category {
            font-size: 12px;
            color: #888;
            font-weight: bold;
            margin: 15px 0 5px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ================= 右側主內容區 ================= */
        .main-content {
            flex-grow: 1;
            height: 100%;
            overflow-y: auto; /* 讓右側可以獨立捲動 */
            background-color: #ffffff;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Markdown 容器 */
        .markdown-body {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ================= 手機版響應式 ================= */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #e1e4e8; }
            .sidebar-nav { max-height: 200px; /* 手機上限制側邊欄高度，避免擋住全部內容 */ }
            .main-content { padding: 20px; height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

    <!-- 左側側邊欄 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>🏘️ 都更文件庫</h2>
            <!-- 可以加一個返回你網站首頁的連結 -->
            <a href="../index.html">← 返回專案總覽</a>
        </div>
        
        <nav class="sidebar-nav" id="nav-links">
            <div class="sidebar-category">2026 年文件</div>
            
            <!-- ⚠️ 以後新增 Markdown 檔，就在這裡加一行 <a> 連結 ⚠️ -->
            <!-- 注意 href 寫法： ?file=你的檔案路徑 -->
            
            <a href="?file=urban-renewal/20260409.md">2026.04.09 - 專案啟動會議</a>
            <a href="?file=urban-renewal/20260410.md">2026.04.10 - 企業持有不動產轉移個人之稅務</a>
        </nav>
        <nav class="sidebar-nav" id="nav-links">
            <div class="sidebar-category">Trip</div>
            
            
            <a href="?file=trip/singaport-australia.md">singaport-australia</a>
        </nav>
    </aside>

    <!-- 右側 Markdown 內容顯示區 -->
    <main class="main-content">
        <div id="content" class="markdown-body">
            <!-- 預設歡迎畫面 -->
            <h1>歡迎使用都更文件庫</h1>
            <p>請從左側選單選擇要閱讀的文件。</p>
        </div>
    </main>

    <script>
        // 1. 取得網址列的 file 參數
        const urlParams = new URLSearchParams(window.location.search);
        const filePath = urlParams.get('file');

        // 2. 如果有指定檔案，就去抓取 Markdown
        if (filePath) {
            document.getElementById('content').innerHTML = '載入中...';
            
            fetch(filePath)
                .then(response => {
                    if (!response.ok) throw new Error('找不到檔案，請確認路徑是否正確。');
                    return response.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = marked.parse(text);
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `<h1 style="color:red;">發生錯誤</h1><p>${error.message}</p>`;
                });
        }

        // 3. 自動高亮左側選單 (Active 狀態)
        // 找出所有左側選單的連結
        const navLinks = document.querySelectorAll('#nav-links a');
        navLinks.forEach(link => {
            // 如果這個連結的 href 跟現在網址列的參數一樣，就加上 active class
            if (filePath && link.getAttribute('href') === `?file=${filePath}`) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
