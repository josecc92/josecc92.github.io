<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jcap Decrypter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* --- 1. Global Modern Styles --- */
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #6c757d;
            --border-color: #dee2e6;
            --shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--shadow); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* --- 2. Upload Section and Password --- */
        #upload-section {
            display: flex; flex-direction: column; align-items: center;
            max-width: 500px; margin: 100px auto;
        }

        #upload-section h2 { font-size: 28px; margin-bottom: 30px; font-weight: 800; }

        .upload-area {
            position: relative; border: 2px dashed var(--primary-color); border-radius: 15px;
            padding: 40px 20px; text-align: center; background-color: #fbfdff;
            transition: all 0.3s ease; margin-bottom: 25px; overflow: hidden; width: 100%; cursor: pointer;
        }

        .upload-area:hover, .upload-area.dragover {
            background-color: #f0f8ff; border-color: var(--primary-hover);
            transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,123,255,0.1);
        }

        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        .upload-text { color: var(--text-sub); font-weight: 500; }
        #fileInput { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .password-group { width: 100%; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="password"] {
            padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px;
            width: 100%; box-sizing: border-box; font-size: 16px; transition: border-color 0.2s;
        }
        input[type="password"]:focus { border-color: var(--primary-color); outline: none; }

        .btn-run {
            background-color: var(--primary-color); color: white; border: none; padding: 15px 30px;
            border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 16px; width: 100%;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-run:hover { background-color: var(--primary-hover); }
        .btn-run:active { transform: scale(0.98); }

        #statusMsg { text-align: center; font-size: 0.9em; margin-top: 15px; }

        /* --- 3. Decrypted Content Display Section (Integrated Layout) --- */
        #display-section h2 {
            font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 30px;
            border-bottom: 2px solid #f1f3f5; padding-bottom: 15px;
        }

        .content-layout { display: flex; flex-direction: column; gap: 30px; }
        @media (min-width: 768px) { .content-layout { flex-direction: row; } }

        .meta-column { flex: 1; }
        .media-column { flex: 1.5; display: flex; flex-direction: column; align-items: center; }

        .meta-data { background: #fbfdff; padding: 25px; border-radius: 15px; border: 1px solid #eef2f5; }
        .meta-data p { margin: 12px 0; border-bottom: 1px solid #f8f9fa; padding-bottom: 12px; }
        .meta-data p:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .meta-data strong { color: var(--text-main); font-weight: 600; display: inline-block; min-width: 80px; margin-right: 10px; }
        .meta-data span { color: #555; word-break: break-all; }

        /* --- 4. Carousel Core Fix (Fixed Height to Prevent Jitter) --- */
        #carousel-area { position: relative; width: 100%; display: none; }

        .media-wrapper {
            display: none; width: 100%; height: 450px; border-radius: 15px;
            overflow: hidden; background-color: #000; position: relative;
        }
        .media-wrapper.active { display: block; }
        .media-wrapper img, .media-wrapper video {
            width: 100%; height: 100%; display: block; margin: 0; object-fit: contain;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.4);
            color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px;
            cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; backdrop-filter: blur(2px);
        }
        .nav-btn:hover { background: rgba(0, 0, 0, 0.7); }
        #prevBtn { left: 15px; }
        #nextBtn { right: 15px; }

        #carousel-indicator { text-align: center; margin-top: 15px; color: var(--text-sub); font-weight: 500; display: none; }

        .motion-icon {
            position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.5); color: white;
            padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 6px; z-index: 10; pointer-events: none; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="card" id="upload-section">
        <h2>Decode JCAP Capsule</h2>
        <div class="upload-area" id="dropZone">
            <div class="upload-icon">📄</div>
            <div class="upload-text" id="fileNameDisplay">Click to select or drag .jcap file here</div>
            <input type="file" id="fileInput" accept=".jcap">
        </div>
        <div class="password-group">
            <label for="passwordInput">Secret Password:</label>
            <input type="password" id="passwordInput" placeholder="••••••••••••">
        </div>
        <button class="btn-run" onclick="decryptAndRender()">🚀 Decrypt and Render</button>
        <p id="statusMsg"></p>
    </div>

    <div class="card hidden" id="display-section">
        <h2 id="display-location"></h2>
        <div class="content-layout">
            
            <div class="meta-column">
                <div class="meta-data" id="dynamic-meta-container">
                    </div>
            </div>
            
            <div class="media-column">
                <div id="carousel-area">
                    <button id="prevBtn" class="nav-btn">◀</button>
                    <div id="media-container"></div>
                    <button id="nextBtn" class="nav-btn">▶</button>
                </div>
                <div id="carousel-indicator"></div>
            </div>
            
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) { fileInput.files = e.dataTransfer.files; updateFileName(); }
        });
        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = `Already selected: ${fileInput.files[0].name}`;
                fileNameDisplay.style.color = '#007bff'; fileNameDisplay.style.fontWeight = 'bold';
            } else {
                fileNameDisplay.textContent = 'Click to select or drag .jcap file here';
                fileNameDisplay.style.color = '#555'; fileNameDisplay.style.fontWeight = 'normal';
            }
        }

        function setStatus(msg, isError = false) {
            const statusEl = document.getElementById('statusMsg');
            statusEl.textContent = msg; statusEl.style.color = isError ? 'red' : 'dimgray';
        }

        async function decryptAndRender() {
            const fileInput = document.getElementById('fileInput');
            const passwordInput = document.getElementById('passwordInput').value;

            if (fileInput.files.length === 0 || !passwordInput) {
                setStatus("Please select a file and enter a password", true); return;
            }

            try {
                setStatus("Reading file...");
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();

                const salt = arrayBuffer.slice(0, 16);
                const nonce = arrayBuffer.slice(16, 28);
                const ciphertext = arrayBuffer.slice(28);

                setStatus("Calculating decryption key (PBKDF2)...");
                const enc = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    "raw", enc.encode(passwordInput), { name: "PBKDF2" }, false, ["deriveKey"]
                );
                const aesKey = await crypto.subtle.deriveKey(
                    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
                );

                setStatus("Decrypting file (AES-GCM)...");
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: nonce }, aesKey, ciphertext
                );

                setStatus("Parsing package file (JSZip)...");
                const zip = await JSZip.loadAsync(decryptedBuffer);
                const metaText = await zip.file("metadata.json").async("string");
                const metadata = JSON.parse(metaText);

                // --- Analysis Media ---
                const mediaContainer = document.getElementById('media-container');
                mediaContainer.innerHTML = ''; 

                const mediaItems = metadata.media || [];
                let mediaWrappers = []; 
                let currentIndex = 0;   

                if (mediaItems.length === 0) {
                    const hasOldImg = zip.file("image.jpg") !== null;
                    const hasOldVid = zip.file("video.mp4") !== null;
                    if (hasOldImg && hasOldVid) { mediaItems.push({ type: 'motion_photo', image: 'image.jpg', video: 'video.mp4' }); }
                    else if (hasOldImg) { mediaItems.push({ type: 'image', image: 'image.jpg' }); }
                    else if (hasOldVid) { mediaItems.push({ type: 'video', video: 'video.mp4' }); }
                }

                for (const item of mediaItems) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'media-wrapper'; 
                    
                    if (item.type === 'motion_photo') {
                        const imgBlob = await zip.file(item.image).async("blob");
                        const vidBlob = await zip.file(item.video).async("blob");
                        const imgEl = document.createElement('img'); imgEl.src = URL.createObjectURL(imgBlob);
                        const vidEl = document.createElement('video');
                        vidEl.src = URL.createObjectURL(new Blob([vidBlob], { type: 'video/mp4' }));
                        vidEl.controls = true; vidEl.classList.add('hidden');
                        const iconEl = document.createElement('div'); iconEl.className = 'motion-icon'; iconEl.innerHTML = '▶ 動態照片';
                        
                        wrapper.style.cursor = 'pointer';
                        wrapper.appendChild(imgEl); wrapper.appendChild(vidEl); wrapper.appendChild(iconEl);
                        wrapper.addEventListener('click', () => {
                            if (vidEl.classList.contains('hidden')) {
                                imgEl.classList.add('hidden'); iconEl.classList.add('hidden');
                                vidEl.classList.remove('hidden'); wrapper.style.cursor = 'default'; vidEl.play();
                            }
                        });
                    } else if (item.type === 'image') {
                        const imgBlob = await zip.file(item.image).async("blob");
                        const imgEl = document.createElement('img'); imgEl.src = URL.createObjectURL(imgBlob);
                        wrapper.appendChild(imgEl);
                    } else if (item.type === 'video') {
                        const vidBlob = await zip.file(item.video).async("blob");
                        const vidEl = document.createElement('video');
                        vidEl.src = URL.createObjectURL(new Blob([vidBlob], { type: 'video/mp4' }));
                        vidEl.controls = true; wrapper.appendChild(vidEl);
                    }
                    mediaWrappers.push(wrapper); mediaContainer.appendChild(wrapper);
                }

                const carouselArea = document.getElementById('carousel-area');
                const indicator = document.getElementById('carousel-indicator');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');

                function showMedia(index) {
                    if (mediaWrappers.length === 0) return;
                    currentIndex = (index + mediaWrappers.length) % mediaWrappers.length;
                    mediaWrappers.forEach(w => {
                        w.classList.remove('active');
                        const video = w.querySelector('video'); if (video) video.pause();
                    });
                    mediaWrappers[currentIndex].classList.add('active');
                    indicator.textContent = `${currentIndex + 1} / ${mediaWrappers.length}`;
                }

                if (mediaWrappers.length > 0) {
                    carouselArea.style.display = 'block'; indicator.style.display = 'block';
                    if (mediaWrappers.length === 1) { prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; }
                    else { prevBtn.style.display = 'flex'; nextBtn.style.display = 'flex'; }
                    showMedia(0);
                }
                prevBtn.onclick = () => showMedia(currentIndex - 1);
                nextBtn.onclick = () => showMedia(currentIndex + 1);

                // ---------------------------------------------------------
                // 💡 Dynamic Metadata Rendering Logic (Backward Compatibility)
                // ---------------------------------------------------------
                const metaContainer = document.getElementById('dynamic-meta-container');
                metaContainer.innerHTML = ''; 

                let infoData = metadata.info;
                
                // Backward Compatibility: If this is an older capsule (no info), assemble the old fixed fields into info format
                if (!infoData) {
                    infoData = {
                        "Time": metadata.timestamp || "Unknown",
                        "Location": metadata.location || "Unknown",
                        "Description": metadata.description || "None",
                        "Experience": metadata.feeling || "None"
                    };
                }

                // Determine the main title (prefer 'Title')
                const mainTitle = infoData['Title'] || metadata.location || "Memory Capsule";
                document.getElementById('display-location').textContent = mainTitle;

                // Loop through infoData to dynamically create key-value pairs
                for (const [key, value] of Object.entries(infoData)) {
                    const pTag = document.createElement('p');
                    
                    const strongTag = document.createElement('strong');
                    strongTag.textContent = `${key}：`;
                    
                    const spanTag = document.createElement('span');
                    spanTag.textContent = value;
                    
                    pTag.appendChild(strongTag);
                    pTag.appendChild(spanTag);
                    metaContainer.appendChild(pTag);
                }

                document.getElementById('upload-section').classList.add('hidden');
                document.getElementById('display-section').classList.remove('hidden');

            } catch (error) { console.error(error); setStatus("Decryption failed! Incorrect password or corrupted file.", true); }
        }
    </script>
</body>
</html>
