<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站總首頁 | 專案管理系統</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* 頂部導覽列 / 橫幅 */
        .hero {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            text-align: center;
            padding: 60px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .hero h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
        }
        .hero p {
            margin-top: 15px;
            font-size: 18px;
            opacity: 0.9;
        }

        /* 內容區塊 - 卡片網格設計 */
        .container {
            max-width: 1000px;
            margin: -30px auto 40px auto; /* 讓卡片往上稍微覆蓋橫幅，增加立體感 */
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* 微調最小寬度以容納三張卡片 */
            gap: 25px;
        }

        /* 導覽卡片 */
        .nav-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 5px solid transparent;
        }

        .nav-card.ur-project { border-top-color: #e74c3c; }
        .nav-card.jcap-decrypter { border-top-color: #2ecc71; }
        .nav-card.investment-calc { border-top-color: #f39c12; } /* 新增：計算機卡片的顏色 */

        .nav-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }

        .nav-card .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .nav-card h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #2c3e50;
        }

        .nav-card p {
            margin: 0;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>我的專案管理入口網</h1>
        <p>點選下方區塊進入各專案文件庫</p>
    </div>

    <div class="container">
        
        <a href="markdown/markdown-viewer.html" class="nav-card ur-project">
            <div class="icon">🏘️</div>
            <h2>都市更新專案</h2>
            <p>包含法規試算、會議記錄、地主意願調查及進度追蹤報告。</p>
        </a>

        <a href="compound_interest.html" class="nav-card investment-calc">
            <div class="icon">📈</div>
            <h2>投資複利試算</h2>
            <p>支援初始基準金額、後續定期定額、以及投入與停扣雙階段的複利試算工具。</p>
        </a>
        <a href="loan-vs-dca-calculator.html" class="nav-card investment-calc">
            <div class="icon">📈</div>
            <h2>信貸 vs 定期定額試算</h2>
            <p>支援信貸 vs 定期定額複利試算工具。</p>
        </a>

        <a href="jcap-decrypter.html" class="nav-card jcap-decrypter">
            <div class="icon">📄</div>
            <h2>其他專案</h2>
            <p>建置中，未來將放入其他建案的相關文件與進度。</p>
        </a>

    </div>

</body>
</html>
