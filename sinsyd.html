                prompt: "An Asian family of four (parents and two little girls aged 6 and 3) exploring happily. Having fun in front of the Universal Studios globe and the spectacular Jewel Changi indoor tropical waterfall. Lots of clean negative space. Bright sunny day, Cute hand-drawn journal style, pastel colors. --ar 3:4",
                title: "Day 9 🎢 赤道獅城快閃",
                subtitle: "08/29 六",
                date: "",
                role: "",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-4">「從冬天一秒變夏天！環球影城大冒險」</h3>
                    <p class="text-slate-600 leading-relaxed mb-6">
                        清晨抵達新加坡，我們脫下厚外套，換上夏裝！白天在環球影城盡情尖叫歡笑，晚上回到機場，一邊吃著香甜的咖椰吐司，一邊看著星耀樟宜裡超巨大的室內瀑布，簡直像夢一樣。
                    </p>
                    <div class="mt-auto pt-6 border-t border-slate-100">
                        <p class="text-sm font-semibold text-slate-500">📍 行程小記：</p>
                        <ul class="text-sm text-slate-500 mt-1 list-disc pl-4 space-y-1">
                            <li>清晨：抵達新加坡，雙寶推車補眠</li>
                            <li>上午：福康寧公園 或 魚尾獅公園</li>
                            <li>白天：暢玩 新加坡環球影城 (USS)</li>
                            <li>傍晚：Hub and Spoke Cafe 休息沖澡</li>
                            <li>晚上：亞坤加椰吐司 👉 星耀樟宜 (Jewel) 瀑布燈光秀</li>
                        </ul>
                    </div>
                `
            },
            {
                id: "day10",
                bgColor: "bg-amber-50",
                prompt: "An Asian family of four (parents and two little girls aged 6 and 3) exploring happily. Sitting around a wooden table full of travel souvenirs like Tim Tam chocolate biscuits, Papaw ointment, and Kaya jam. Lots of clean negative space. Bright sunny day, Cute hand-drawn journal style, pastel colors. --ar 3:4",
                title: "Day 10 🏠 滿載回憶的歸途",
                subtitle: "08/30 日",
                date: "",
                role: "",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-4">「甜甜的戰利品，我們回家囉！」</h3>
                    <p class="text-slate-600 leading-relaxed mb-6">
                        行李箱裡裝滿了 Tim Tam 巧克力、紅色的木瓜霜，還有一路上的歡笑聲。10 天的雙城大冒險圓滿達成，寶貝們在推車上睡得香甜，我們平安飛抵台北，期待下一次的旅行！
                    </p>
                    <div class="mt-auto pt-6 border-t border-slate-100">
                        <p class="text-sm font-semibold text-slate-500">📍 行程小記：</p>
                        <ul class="text-sm text-slate-500 mt-1 list-disc pl-4 space-y-1">
                            <li>上午：搭乘 TR866 班機，平安抵達台北 (TPE)</li>
                        </ul>
                    </div>
                `
            }
        ];

        let currentPage = 0;
        let chartInstance = null; // 儲存圖表實例以備銷毀重建

        // DOM 元素
        const leftPage = document.getElementById('left-page');
        const rightPage = document.getElementById('right-page');
        const pageIndicator = document.getElementById('page-indicator');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnPrevSide = document.getElementById('btn-prev-side');
        const btnNextSide = document.getElementById('btn-next-side');

        function renderPage(index) {
            const data = bookData[index];
            
            // 加入淡入動畫特效
            leftPage.classList.remove('fade-in');
            rightPage.classList.remove('fade-in');
            void leftPage.offsetWidth; // 觸發重繪
            leftPage.classList.add('fade-in');
            rightPage.classList.add('fade-in');

            // 渲染左頁 (圖片與 Prompt 佔位符)
            // 將底色動態替換
            leftPage.className = `w-full md:w-1/2 h-1/2 md:h-full relative book-spine-shadow flex flex-col items-center justify-center p-8 border-b md:border-b-0 md:border-r border-slate-200 transition-colors duration-500 fade-in ${data.bgColor}`;
            
            leftPage.innerHTML = `
                <div class="w-full h-full border-2 border-dashed border-slate-400/50 rounded-xl flex flex-col items-center justify-center p-6 text-center relative bg-white/40 backdrop-blur-sm">
                    <span class="text-4xl mb-4 opacity-70">🖼️</span>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">AI Image Placeholder</p>
                    <p class="text-sm text-slate-600 italic max-w-sm">
                        "${data.prompt}"
                    </p>
                    <div class="absolute bottom-4 left-0 w-full text-center">
                        <span class="text-xs bg-white/80 px-3 py-1 rounded-full text-slate-400 shadow-sm">請在此處替換生成的真實圖片</span>
                    </div>
                </div>
            `;

            // 渲染右頁 (文字內容)
            let rightHTML = '';
            if (index === 0) { // 封面特殊排版
                rightHTML = `
                    <div class="flex-grow flex flex-col justify-center text-center px-4">
                        <h2 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-4 leading-tight">${data.title}</h2>
                        <h3 class="text-xl md:text-2xl text-slate-600 mb-8 font-medium">${data.subtitle}</h3>
                        <div class="inline-block bg-white shadow-sm border border-slate-100 rounded-lg p-6 mb-8 text-left max-w-sm mx-auto w-full">
                            <p class="flex items-center text-slate-600 mb-3"><span class="mr-3 text-lg">🗓️</span> ${data.date}</p>
                            <p class="flex items-center text-slate-600"><span class="mr-3 text-lg">👨‍👩‍👧‍👧</span> ${data.role}</p>
                        </div>
                        <p class="text-slate-500 leading-relaxed">${data.content}</p>
                    </div>
                `;
            } else { // 內頁常規排版
                rightHTML = `
                    <div class="flex-grow flex flex-col pt-4 md:pt-8">
                        <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-2">${data.title}</h2>
                        ${data.subtitle ? `<h3 class="text-lg text-slate-500 font-medium mb-8">${data.subtitle}</h3>` : '<div class="mb-8"></div>'}
                        <div class="text-slate-700 flex-grow">
                            ${data.content}
                        </div>
                    </div>
                `;
            }
            rightPage.innerHTML = rightHTML;

            // 更新控制列與按鈕狀態
            pageIndicator.innerText = `P.${index + 1} / ${bookData.length}`;
            
            const isFirst = index === 0;
            const isLast = index === bookData.length - 1;
            
            btnPrev.disabled = isFirst;
            btnPrevSide.disabled = isFirst;
            btnNext.disabled = isLast;
            btnNextSide.disabled = isLast;

            // 如果是行程總表頁 (index === 1)，則初始化 Chart.js 圖表
            if (index === 1) {
                setTimeout(initSummaryChart, 100); // 延遲確保 DOM 已準備好
            } else if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
        }

        function initSummaryChart() {
            const canvas = document.getElementById('summaryChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['城市漫步', '自然與動物', '主題樂園', '交通轉機'],
                    datasets: [{
                        data: [35, 35, 15, 15],
                        backgroundColor: ['#bae6fd', '#bbf7d0', '#fbcfe8', '#fef08a'],
                        borderWidth: 2,
                        borderColor: '#ffffff',
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { 
                            position: 'right',
                            labels: {
                                font: { family: "'Nunito', 'Noto Sans TC', sans-serif" },
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ': ' + context.parsed + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        function nextPage() {
            if (currentPage < bookData.length - 1) {
                currentPage++;
                renderPage(currentPage);
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage(currentPage);
            }
        }

        // 初始化書籍
        window.onload = () => {
            renderPage(0);
        };
    </script>
</body>
</html>
